# Sutra memory-layer services (Phase 1.3).
# Bring up:  docker compose up -d
# Tear down: docker compose down   (add -v to wipe data)
#
# Port note: FalkorDB IS a Redis-protocol server, so it cannot share 6379 with
# plain Redis. FalkorDB stays on 6379 (Graphiti's backend); session Redis moves
# to 6380. Keep .env in sync.
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: sutra-falkordb
    ports:
      - "6379:6379"      # graph memory (Graphiti backend)
      - "3001:3000"      # FalkorDB Browser UI
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sutra-qdrant
    ports:
      - "6333:6333"      # REST
      - "6334:6334"      # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sutra-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6380:6379"      # session + tool state (host 6380 to avoid FalkorDB)
    volumes:
      - redis_data:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: sutra-searxng
    ports:
      - "8080:8080"      # web_search skill hits /search?format=json here
    volumes:
      - ./infra/searxng:/etc/searxng:rw   # settings.yml (json API + limiter off)
    restart: unless-stopped

volumes:
  falkordb_data:
  qdrant_data:
  redis_data:
