[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-os"
version = "0.1.0"
requires-python = ">=3.11"
# Base = what's needed to import friday and run the core agent + text CLI. numpy and
# psutil were previously buried in optional extras, yet the CORE path imports them
# (core/dreaming.py, and skills/system_info.py which autodiscover() always imports) —
# so a base `pip install -e .` produced a Sutra that couldn't import its own agent or
# register a single skill. They belong here. Heavy ML/voice/browser stacks stay opt-in.
dependencies = [
    "litellm>=1.40",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "keyring>=25",
    "rich>=13",
    "typer>=0.12",
    "numpy>=1.26",   # core: recall index, dreaming, rag, voice ndarray ops
    "psutil>=5.9",   # core: system_info skill (CPU/RAM/disk/GPU) — imported at autodiscover
    "opencv-python-headless>=4.9",  # vision: fast template match / element detection (CI-safe)
    "mss>=9",        # vision: fast screen capture (~50 fps vs ~3 with ImageMagick)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
search = ["httpx>=0.27"]
voice = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "onnxruntime-gpu>=1.18",
    "sounddevice>=0.4",
    "webrtcvad-wheels>=2.0",
    "pynput>=1.7",
    "openwakeword>=0.4",
]
memory = [
    "graphiti-core>=0.29",
    "falkordb>=1.1",
    "redis>=5",
]
action = [
    "playwright>=1.44",
]
ambient = [
    "pynput>=1.7",
]
mcp = [
    "mcp>=1.2",
]
telegram = [
    "python-telegram-bot>=21",
]
# Local worker fine-tuning (QLoRA). Heavy + CUDA-specific, so NOT part of [all] — install on the
# GPU box only, when you are ready to train: pip install -e ".[train]"
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "accelerate>=0.30",
]
# Everything, for a full install: pip install -e ".[all]"
all = [
    "friday-os[dev,search,voice,memory,action,ambient,mcp,telegram]",
]

[project.scripts]
sutra = "friday.cli:app"

# Without this, setuptools' flat-layout auto-discovery sees friday/, infra/ (SearXNG +
# systemd config — not Python) and scripts/ as competing top-level packages and refuses
# to build ("Multiple top-level packages discovered"). A clean `pip install -e .` failed;
# it only worked locally because the package was already installed. Package just friday*.
[tool.setuptools.packages.find]
include = ["friday*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
