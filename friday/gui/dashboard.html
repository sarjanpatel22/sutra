<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sutra — Dashboard</title>
<style>
  /* ── Sutra dashboard: smoked-glass panels over the living orb.
        Palette is the orb's: warm obsidian, cold champagne golds. Slow, royal. ── */
  :root {
    --obsidian: #070502;
    --platinum: #FBF8EC;
    --champagne: #D8C076;
    --gold-soft: rgba(216,196,133,0.55);
    --gold-dim: rgba(208,192,140,0.42);
    --gold-faint: rgba(216,196,133,0.13);
    --ink: rgba(245,238,220,0.86);
    --ink-dim: rgba(214,200,165,0.58);
    --glass: rgba(10,7,3,0.52);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--obsidian); }
  body { font-family: "JetBrains Mono", monospace; color: var(--ink); }

  /* the orb, alive underneath everything */
  #orb-frame {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; pointer-events: none;
  }

  .panel {
    position: fixed; display: flex; flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.05);
    -webkit-backdrop-filter: blur(18px) saturate(1.05);
    border: 1px solid var(--gold-faint); border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 18px 50px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .panel-title {
    padding: 12px 16px 10px; font-size: 9px; letter-spacing: 4px;
    color: var(--gold-dim); border-bottom: 1px solid rgba(216,196,133,0.08);
    user-select: none; flex: 0 0 auto;
  }

  /* ── conversation ── */
  #chat { left: 24px; top: 72px; bottom: 24px; width: 396px; }
  #transcript { flex: 1 1 auto; overflow-y: auto; padding: 14px 14px 6px; scrollbar-width: none; }
  #transcript::-webkit-scrollbar { display: none; }
  .msg { margin-bottom: 14px; max-width: 92%; animation: rise 0.5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .msg .meta { font-size: 8px; letter-spacing: 2px; color: var(--gold-dim); margin-bottom: 4px; }
  .msg .body { font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user { margin-left: auto; text-align: right; }
  .msg.user .body { color: var(--ink-dim); }
  .msg.sutra .body { color: var(--ink); }
  .msg.system .body { color: rgba(168,148,90,0.7); font-style: italic; font-size: 11px; }
  .route { font-size: 8px; letter-spacing: 2px; color: rgba(216,196,133,0.42);
    margin: -8px 0 13px; text-align: right; }
  .route b { color: rgba(245,230,195,0.7); font-weight: 400; }

  #thinking { display: none; padding: 0 16px 10px; flex: 0 0 auto; }
  #thinking.on { display: block; }
  #thinking span {
    display: inline-block; width: 4px; height: 4px; margin-right: 6px; border-radius: 50%;
    background: var(--gold-soft); animation: breathe 1.8s ease-in-out infinite;
  }
  #thinking span:nth-child(2) { animation-delay: 0.3s; }
  #thinking span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes breathe { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }

  #composer {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 12px; border-top: 1px solid rgba(216,196,133,0.08);
  }
  #input {
    flex: 1; background: rgba(216,196,133,0.05); border: 1px solid var(--gold-faint);
    border-radius: 6px; padding: 10px 12px; color: var(--ink);
    font: inherit; font-size: 12px; outline: none; transition: border-color 0.4s ease;
  }
  #input:focus { border-color: rgba(216,196,133,0.35); }
  #input::placeholder { color: rgba(208,192,140,0.30); }
  #input:disabled { opacity: 0.45; }
  #tier {
    background: rgba(216,196,133,0.05); color: var(--gold-soft);
    border: 1px solid var(--gold-faint); border-radius: 6px;
    font: inherit; font-size: 10px; letter-spacing: 1px; padding: 10px 6px; outline: none;
  }
  #tier option { background: #14100a; }

  /* ── right column ── */
  #stats { right: 24px; top: 72px; width: 324px; }
  #stats-body { padding: 12px 16px 14px; font-size: 10px; letter-spacing: 1px; }
  .stat-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-dim); }
  .stat-row b { color: var(--gold-soft); font-weight: 400; }
  .stat-head { margin: 8px 0 2px; font-size: 8px; letter-spacing: 3px; color: var(--gold-dim); }

  #actions { right: 24px; top: 318px; bottom: 24px; width: 324px; }
  #feed { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .act {
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    padding: 6px 4px; font-size: 10px; letter-spacing: 1px; color: var(--ink-dim);
    border-bottom: 1px solid rgba(216,196,133,0.05); animation: rise 0.5s ease both;
  }
  .act .skill { color: var(--gold-soft); }
  .act .chip { font-size: 8px; letter-spacing: 2px; color: var(--gold-dim); }
  .act .chip.ok { color: rgba(216,196,133,0.8); }
  .act .chip.declined, .act .chip.error { color: rgba(150,120,70,0.9); }

  .confirm-card {
    margin: 10px 2px; padding: 12px; border: 1px solid rgba(216,192,118,0.45);
    border-radius: 8px; background: rgba(216,196,133,0.06); animation: rise 0.5s ease both;
  }
  .confirm-card .ask { font-size: 8px; letter-spacing: 3px; color: var(--gold-soft); margin-bottom: 6px; }
  .confirm-card .what { font-size: 12px; color: var(--platinum); margin-bottom: 6px; }
  .confirm-card .args {
    font-size: 9px; color: var(--ink-dim); white-space: pre-wrap; word-break: break-all;
    max-height: 90px; overflow-y: auto; margin-bottom: 10px;
  }
  .confirm-card .btns { display: flex; gap: 8px; }
  .confirm-card button {
    flex: 1; padding: 8px 0; font: inherit; font-size: 9px; letter-spacing: 3px;
    border-radius: 6px; cursor: pointer; transition: all 0.3s ease;
  }
  .confirm-card .yes {
    background: rgba(216,192,118,0.18); border: 1px solid rgba(216,192,118,0.6);
    color: var(--platinum);
  }
  .confirm-card .yes:hover { background: rgba(216,192,118,0.3); }
  .confirm-card .no {
    background: transparent; border: 1px solid var(--gold-faint); color: var(--ink-dim);
  }
  .confirm-card .no:hover { border-color: rgba(216,196,133,0.35); }
  .confirm-card.resolved { opacity: 0.45; }
  .confirm-card.resolved button { pointer-events: none; opacity: 0.4; }
  .confirm-card .verdict { font-size: 8px; letter-spacing: 3px; color: var(--gold-soft); margin-top: 8px; }

  /* ──────────────────────────────────────────────────────────────────────────
     GENERATIVE UI — centre widget panel
     Appears below the orb when Sutra has something structured to show.
     Hidden by default; revealed per-reply.
  ────────────────────────────────────────────────────────────────────────── */
  #widget-panel {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    top: 72px; bottom: 24px;
    width: 520px; max-width: calc(100vw - 880px); /* squeeze between the side panels */
    display: none; flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.05);
    -webkit-backdrop-filter: blur(18px) saturate(1.05);
    border: 1px solid var(--gold-faint); border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 18px 50px rgba(0,0,0,0.45);
    overflow: hidden;
    animation: rise 0.5s ease both;
    z-index: 10;
  }
  #widget-panel.visible { display: flex; }
  #widget-panel .panel-title { flex: 0 0 auto; }
  #widget-body {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 14px;
    scrollbar-width: none; display: flex; flex-direction: column; gap: 14px;
  }
  #widget-body::-webkit-scrollbar { display: none; }

  /* ── widget: markdown ── */
  .w-markdown {
    font-size: 12px; line-height: 1.75; color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
  }

  /* ── widget: metric grid ── */
  .w-metrics {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px;
  }
  .w-metric-cell {
    background: rgba(216,196,133,0.05); border: 1px solid var(--gold-faint);
    border-radius: 8px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
    animation: rise 0.5s ease both;
  }
  .w-metric-label {
    font-size: 8px; letter-spacing: 3px; color: var(--gold-dim); text-transform: uppercase;
  }
  .w-metric-value {
    font-size: 22px; color: var(--champagne); letter-spacing: 1px; line-height: 1.1;
  }
  .w-metric-unit { font-size: 9px; color: var(--ink-dim); letter-spacing: 1px; }

  /* ── widget: key-value ── */
  .w-kv { display: flex; flex-direction: column; gap: 4px; }
  .w-kv-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 5px 0; border-bottom: 1px solid rgba(216,196,133,0.06);
    font-size: 10px; letter-spacing: 1px;
  }
  .w-kv-row:last-child { border-bottom: none; }
  .w-kv-label { color: var(--gold-dim); min-width: 80px; }
  .w-kv-value { color: var(--ink); text-align: right; word-break: break-all; }

  /* ── widget: code ── */
  .w-code {
    background: rgba(7,5,2,0.65); border: 1px solid rgba(216,196,133,0.10);
    border-radius: 8px; overflow: hidden;
  }
  .w-code-lang {
    padding: 5px 12px 4px; font-size: 8px; letter-spacing: 3px; color: var(--gold-dim);
    border-bottom: 1px solid rgba(216,196,133,0.08); text-transform: uppercase;
  }
  .w-code-body {
    padding: 12px 14px; font-size: 11px; line-height: 1.65;
    color: var(--ink); overflow-x: auto; white-space: pre;
    scrollbar-width: thin; scrollbar-color: rgba(216,196,133,0.15) transparent;
  }

  /* ── widget: bar chart ── */
  .w-chart { display: flex; flex-direction: column; gap: 8px; }
  .w-chart-title {
    font-size: 8px; letter-spacing: 3px; color: var(--gold-dim); text-transform: uppercase;
    margin-bottom: 2px;
  }
  .w-bar-row { display: flex; align-items: center; gap: 8px; }
  .w-bar-label { font-size: 9px; color: var(--ink-dim); min-width: 80px; letter-spacing: 1px; text-align: right; }
  .w-bar-track {
    flex: 1; height: 4px; background: rgba(216,196,133,0.08); border-radius: 2px; overflow: hidden;
  }
  .w-bar-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, rgba(208,192,140,0.5), var(--champagne));
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .w-bar-val { font-size: 9px; color: var(--champagne); min-width: 40px; letter-spacing: 1px; }

  /* ── widget: cards ── */
  .w-cards { display: flex; flex-direction: column; gap: 8px; }
  .w-card {
    background: rgba(216,196,133,0.04); border: 1px solid rgba(216,196,133,0.10);
    border-radius: 8px; padding: 10px 12px; animation: rise 0.5s ease both;
    transition: border-color 0.3s ease;
  }
  .w-card:hover { border-color: rgba(216,196,133,0.28); }
  .w-card a { text-decoration: none; display: block; }
  .w-card-title { font-size: 11px; color: var(--platinum); margin-bottom: 3px; }
  .w-card-subtitle {
    font-size: 10px; color: var(--ink-dim); line-height: 1.5;
    max-height: 2.8em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .w-card-url { font-size: 8px; color: var(--gold-dim); margin-top: 4px; letter-spacing: 1px; }

  /* ── widget: table ── */
  .w-table-wrap { overflow-x: auto; border-radius: 6px; }
  .w-table {
    width: 100%; border-collapse: collapse; font-size: 10px; letter-spacing: 1px;
  }
  .w-table th {
    text-align: left; padding: 6px 10px; font-size: 8px; letter-spacing: 3px;
    color: var(--gold-dim); border-bottom: 1px solid rgba(216,196,133,0.14);
    white-space: nowrap;
  }
  .w-table td {
    padding: 6px 10px; color: var(--ink-dim); border-bottom: 1px solid rgba(216,196,133,0.05);
    white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis;
  }
  .w-table tr:last-child td { border-bottom: none; }
  .w-table tr:hover td { color: var(--ink); background: rgba(216,196,133,0.03); }

  /* ── widget type badge ── */
  .w-type-badge {
    font-size: 7px; letter-spacing: 2px; color: rgba(216,196,133,0.30);
    text-align: right; margin-top: 4px;
  }
</style>
</head>
<body>

<iframe id="orb-frame" src="/orb" title="presence"></iframe>

<section id="chat" class="panel">
  <div class="panel-title">CONVERSATION</div>
  <div id="transcript"></div>
  <div id="thinking"><span></span><span></span><span></span></div>
  <div id="composer">
    <input id="input" type="text" placeholder="speak to her…" autocomplete="off">
    <select id="tier" title="model tier — auto lets her choose by task weight">
      <option value="auto" selected>auto</option>
      <option value="medium">medium</option>
      <option value="local">local</option>
      <option value="code">code</option>
      <option value="heavy">heavy</option>
      <option value="max">max</option>
    </select>
  </div>
</section>

<!-- ── GENERATIVE UI centre panel ── -->
<section id="widget-panel" class="panel">
  <div class="panel-title">SURFACE &nbsp;·&nbsp; <span id="widget-type-label">—</span></div>
  <div id="widget-body"></div>
</section>

<section id="stats" class="panel">
  <div class="panel-title">TELEMETRY</div>
  <div id="stats-body">loading…</div>
</section>

<section id="actions" class="panel">
  <div class="panel-title">ACTIONS &nbsp;·&nbsp; <span id="gate-note">confirmation gate live</span></div>
  <div id="feed"></div>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const transcript = $("transcript"), feed = $("feed"), input = $("input"), tier = $("tier");
let lastId = 0, busy = false;

const hhmm = (ts) => new Date(ts * 1000).toTimeString().slice(0, 5);
const scroll = (el) => { el.scrollTop = el.scrollHeight; };

function msg(cls, who, text, ts) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = `<div class="meta">${who} · ${hhmm(ts)}</div><div class="body"></div>`;
  d.querySelector(".body").textContent = text;
  transcript.appendChild(d); scroll(transcript);
}

function setBusy(b) {
  busy = b;
  $("thinking").classList.toggle("on", b);
  input.disabled = b;
  if (!b) input.focus();
}

/* ── action feed ── */
function actRow(e) {
  const d = document.createElement("div");
  d.className = "act"; d.dataset.skill = e.skill;
  d.innerHTML = `<span class="skill">✦ ${e.skill}${e.gated ? " ⛨" : ""}</span>
                 <span class="chip">running</span>`;
  feed.appendChild(d); scroll(feed);
}
function actEnd(e) {
  const rows = [...feed.querySelectorAll(`.act[data-skill="${e.skill}"] .chip`)];
  const chip = rows.reverse().find((c) => c.textContent === "running");
  if (chip) { chip.textContent = e.status.toUpperCase(); chip.className = "chip " + e.status; }
}

/* ── confirmation cards: the gate, on screen ── */
function confirmCard(e) {
  const d = document.createElement("div");
  d.className = "confirm-card"; d.dataset.cid = e.confirm_id;
  d.innerHTML = `
    <div class="ask">SUTRA ASKS PERMISSION</div>
    <div class="what"></div>
    <div class="args"></div>
    <div class="btns">
      <button class="yes">APPROVE</button>
      <button class="no">DECLINE</button>
    </div>`;
  d.querySelector(".what").textContent = e.skill;
  d.querySelector(".args").textContent = JSON.stringify(e.args, null, 1);
  d.querySelector(".yes").onclick = () => resolve(e.confirm_id, true);
  d.querySelector(".no").onclick = () => resolve(e.confirm_id, false);
  feed.appendChild(d); scroll(feed);
}
function confirmDone(e) {
  const card = feed.querySelector(`.confirm-card[data-cid="${e.confirm_id}"]`);
  if (!card || card.classList.contains("resolved")) return;
  card.classList.add("resolved");
  const v = document.createElement("div");
  v.className = "verdict";
  v.textContent = e.timeout ? "TIMED OUT — DECLINED" : (e.approved ? "APPROVED" : "DECLINED");
  card.appendChild(v); scroll(feed);
}
async function resolve(cid, approve) {
  await fetch("/api/confirm", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ confirm_id: cid, approve }),
  }).catch(() => {});
}

/* ─────────────────────────────────────────────────────────────────────────────
   GENERATIVE UI — widget renderers
   Each render_* function returns a DOM element in the gold-on-obsidian palette.
───────────────────────────────────────────────────────────────────────────── */

function renderMarkdown(w) {
  const d = document.createElement("div");
  d.className = "w-markdown";
  d.textContent = w.text;
  return d;
}

function renderMetric(w) {
  // Single metric cell — the caller groups multiple metrics in a grid.
  const d = document.createElement("div");
  d.className = "w-metric-cell";
  d.innerHTML =
    `<div class="w-metric-label">${esc(w.label)}</div>` +
    `<div class="w-metric-value">${esc(w.value)}</div>` +
    (w.unit ? `<div class="w-metric-unit">${esc(w.unit)}</div>` : "");
  return d;
}

function renderKeyValue(w) {
  const d = document.createElement("div");
  d.className = "w-kv";
  for (const p of (w.pairs || [])) {
    const row = document.createElement("div");
    row.className = "w-kv-row";
    row.innerHTML = `<span class="w-kv-label">${esc(p.label)}</span>` +
                    `<span class="w-kv-value">${esc(p.value)}</span>`;
    d.appendChild(row);
  }
  return d;
}

function renderCode(w) {
  const d = document.createElement("div");
  d.className = "w-code";
  const lang = w.language || "text";
  d.innerHTML = `<div class="w-code-lang">${esc(lang)}</div>` +
                `<div class="w-code-body"></div>`;
  d.querySelector(".w-code-body").textContent = w.text || "";
  return d;
}

function renderBarChart(w) {
  const d = document.createElement("div");
  d.className = "w-chart";
  if (w.title) {
    const t = document.createElement("div");
    t.className = "w-chart-title"; t.textContent = w.title;
    d.appendChild(t);
  }
  const labels = w.labels || [], values = w.values || [];
  const max = Math.max(...values, 1);
  for (let i = 0; i < labels.length; i++) {
    const pct = (values[i] / max * 100).toFixed(1);
    const val = w.unit ? `${values[i]}${w.unit}` : String(values[i]);
    const row = document.createElement("div");
    row.className = "w-bar-row";
    row.innerHTML =
      `<span class="w-bar-label">${esc(labels[i])}</span>` +
      `<div class="w-bar-track"><div class="w-bar-fill" style="width:0%"></div></div>` +
      `<span class="w-bar-val">${esc(val)}</span>`;
    d.appendChild(row);
    // animate fill after paint
    requestAnimationFrame(() => {
      const fill = row.querySelector(".w-bar-fill");
      if (fill) fill.style.width = pct + "%";
    });
  }
  return d;
}

function renderCards(w) {
  const d = document.createElement("div");
  d.className = "w-cards";
  for (const item of (w.items || [])) {
    const card = document.createElement("div");
    card.className = "w-card";
    const inner = item.url
      ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">
           <div class="w-card-title">${esc(item.title)}</div>
           <div class="w-card-subtitle">${esc(item.subtitle)}</div>
           <div class="w-card-url">${esc(item.url.replace(/^https?:\/\//, ""))}</div>
         </a>`
      : `<div class="w-card-title">${esc(item.title)}</div>
         <div class="w-card-subtitle">${esc(item.subtitle)}</div>`;
    card.innerHTML = inner;
    d.appendChild(card);
  }
  return d;
}

function renderTable(w) {
  const wrap = document.createElement("div");
  wrap.className = "w-table-wrap";
  const tbl = document.createElement("table");
  tbl.className = "w-table";
  const cols = w.columns || [];
  if (cols.length) {
    const thead = document.createElement("thead");
    const tr = document.createElement("tr");
    for (const c of cols) {
      const th = document.createElement("th"); th.textContent = c; tr.appendChild(th);
    }
    thead.appendChild(tr); tbl.appendChild(thead);
  }
  const tbody = document.createElement("tbody");
  for (const row of (w.rows || [])) {
    const tr = document.createElement("tr");
    for (const cell of (Array.isArray(row) ? row : [row])) {
      const td = document.createElement("td"); td.textContent = String(cell); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody); wrap.appendChild(tbl);
  return wrap;
}

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Map type → renderer
const widgetRenderers = {
  markdown: renderMarkdown,
  metric:   renderMetric,
  key_value: renderKeyValue,
  code:     renderCode,
  bar_chart: renderBarChart,
  cards:    renderCards,
  table:    renderTable,
};

/**
 * Render a widget layout (array of specs) into the centre panel.
 * Metric widgets are grouped into a single grid row.
 * If the layout is empty or only a single markdown widget, hides the panel.
 */
function renderWidgets(widgets) {
  const panel = $("widget-panel");
  const body  = $("widget-body");
  const label = $("widget-type-label");
  body.innerHTML = "";

  if (!widgets || widgets.length === 0) { panel.classList.remove("visible"); return; }

  // Suppress the panel for a lone plain-markdown widget — text is already in the
  // conversation panel; duplicating it adds no value.
  const isSoleMd = widgets.length === 1 && widgets[0].type === "markdown";
  if (isSoleMd) { panel.classList.remove("visible"); return; }

  // Collect consecutive metric widgets into a grid container.
  const typeNames = [...new Set(widgets.map((w) => w.type))];
  label.textContent = typeNames.join(" · ");

  let i = 0;
  while (i < widgets.length) {
    const w = widgets[i];
    if (w.type === "metric") {
      // gather a run of metrics
      const grid = document.createElement("div");
      grid.className = "w-metrics";
      while (i < widgets.length && widgets[i].type === "metric") {
        grid.appendChild(renderMetric(widgets[i])); i++;
      }
      body.appendChild(grid);
    } else {
      const renderer = widgetRenderers[w.type];
      if (renderer) body.appendChild(renderer(w));
      i++;
    }
  }

  panel.classList.add("visible");
}

/* ── event stream ── */
const handlers = {
  user:            (e) => {
    msg("user", "YOU", e.text, e.ts);
    if (e.auto) {  // show what she routed to and why
      const d = document.createElement("div");
      d.className = "route";
      d.innerHTML = `&#8627; <b>${e.tier}</b> &middot; ${e.reason || ""}`;
      transcript.appendChild(d); scroll(transcript);
    }
    setBusy(true);
  },
  status:          (e) => setBusy(true),
  reply:           (e) => {
    msg("sutra", "SUTRA", e.text, e.ts);
    setBusy(false);
    // Render the generative UI widget layout if the server sent one.
    if (e.widgets && e.widgets.length) renderWidgets(e.widgets);
  },
  error:           (e) => { msg("system", "SYSTEM", e.text, e.ts); setBusy(false); },
  tool_start:      actRow,
  tool_end:        actEnd,
  confirm_request: confirmCard,
  confirm_result:  confirmDone,
};
const es = new EventSource("/api/events");
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.id <= lastId) return;          // reconnect replay guard
  lastId = e.id;
  (handlers[e.type] || (() => {}))(e);
};

/* ── composer ── */
input.addEventListener("keydown", async (ev) => {
  if (ev.key !== "Enter" || busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const r = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, tier: tier.value }),
  }).then((r) => r.json()).catch((e) => ({ error: String(e) }));
  if (r.error) msg("system", "SYSTEM", r.error, Date.now() / 1000);
});

/* ── telemetry (shape: friday/core/stats.gather_stats) ── */
function fmt(ms) { return ms >= 1000 ? (ms / 1000).toFixed(2) + "s" : Math.round(ms) + "ms"; }
function line(label, m) {
  if (!m || !m.n) return "";
  return `<div class="stat-row"><span>${label}</span>
          <b>${fmt(m.p50)} / ${fmt(m.p95)} · ${m.n}</b></div>`;
}
async function refreshStats() {
  try {
    const s = await fetch("/api/stats").then((r) => r.json());
    let html = "";
    const tiers = Object.entries(s.text_by_tier || {}).filter(([, m]) => m.n);
    if (tiers.length)
      html += `<div class="stat-head">TEXT · p50 / p95 · turns</div>` +
              tiers.map(([t, m]) => line(t, m)).join("");
    const vs = s.voice_stages || {};
    if (vs.total_ms && vs.total_ms.n)
      html += `<div class="stat-head">VOICE · p50 / p95 · turns</div>` +
              line("total", vs.total_ms) + line("stt", vs.stt_ms) +
              line("tts first", vs.tts_first_ms);
    const b = s.budget;
    if (b) {
      html += `<div class="stat-head">SPEND</div>
        <div class="stat-row"><span>today</span><b>$${(b.daily_spent ?? 0).toFixed(4)}</b></div>
        <div class="stat-row"><span>month</span><b>$${(b.monthly_spent ?? 0).toFixed(4)}</b></div>`;
    }
    html += skillsLine;
    $("stats-body").innerHTML = html || "no turns logged yet";
  } catch { /* server going down — leave the last numbers up */ }
}
let skillsLine = "";
fetch("/api/skills").then((r) => r.json()).then((sk) => {
  const gated = sk.filter((s) => s.gated).length;
  skillsLine = `<div class="stat-head">SKILLS</div>
    <div class="stat-row"><span>registered</span><b>${sk.length}</b></div>
    <div class="stat-row"><span>gated ⛨</span><b>${gated}</b></div>`;
  refreshStats();
}).catch(() => {});
refreshStats();
setInterval(refreshStats, 12000);
input.focus();
</script>
</body>
